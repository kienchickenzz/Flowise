services:
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        restart: unless-stopped
        ports:
            - '3001:3000'
        volumes:
            - ./volumes/grafana-data:/var/lib/grafana
            - ./provisioning:/etc/grafana/provisioning
        env_file:
            - .env
        extra_hosts:
            - "host.docker.internal:host-gateway" 