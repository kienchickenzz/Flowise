receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  # The hostmetrics receiver is required to get correct infrastructure metrics in Datadog.
  # hostmetrics:
  #   collection_interval: 10s
  #   scrapers:
  #     paging:
  #       metrics:
  #         system.paging.utilization:
  #           enabled: true
  #     cpu:
  #       metrics:
  #         system.cpu.utilization:
  #           enabled: true
  #     disk:
  #     filesystem:
  #       metrics:
  #         system.filesystem.utilization:
  #           enabled: true
  #     load:
  #     memory:
  #     network:

  # The prometheus receiver scrapes metrics needed for the OpenTelemetry Collector Dashboard.
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otelcol'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

  filelog:
    include_file_path: true
    poll_interval: 10s
    include:
      - /var/log/**/*example*/*.log

processors:
  batch:
    send_batch_max_size: 100
    send_batch_size: 10
    timeout: 10s

# connectors:
#   datadog/connector:

# exporters:
#   datadog/exporter:
#     api:
#       site: us5.datadoghq.com
#       key: "replace_api_key"

exporters:
  # debug:
  #   verbosity: detailed  # Tùy chọn này giúp bạn xem chi tiết dữ liệu
  #   sampling_initial: 5  # In ra 5 item đầu tiên để tránh spam quá nhiều
  #   sampling_thereafter: 200  # Sau đó chỉ in mỗi item thứ 200
  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    metrics:
      receivers: [ prometheus, otlp ]
      processors: [batch]
      exporters: [prometheus]
      # exporters: [debug, prometheus]
