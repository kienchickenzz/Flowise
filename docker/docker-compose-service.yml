services:
    flowise-redis:
        image: redis:6-alpine
        container_name: flowise-redis
        restart: no
        ports:
            - '6380:6379'
        volumes:
            - ./volumes/redis:/data
        networks:
            - flowise-net
        command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-Pa55w.rd}" ]

    flowise-postgres:
        image: postgres:15-alpine
        container_name: flowise-postgres
        restart: no
        networks:
        - flowise-net
        ports:
        - "5433:5432"
        volumes:
        - ./volumes/postgres:/var/lib/postgresql/data
        environment:
        - POSTGRES_DB=${DB_DATABASE:-flowise}
        - POSTGRES_USER=${DB_USERNAME:-postgres}
        - POSTGRES_PASSWORD=${DB_PASSWORD:-Pa55w.rd}
        command: >
            postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'
                    -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
                    -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
                    -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
                    -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
        healthcheck:
            test: [ 'CMD', 'pg_isready' ]
            interval: 1s
            timeout: 3s
            retries: 60

    keycloak:
        image: quay.io/keycloak/keycloak:latest
        container_name: flowise-keycloak
        restart: no
        networks:
            - flowise-net
        ports:
            - "8080:8080"
        environment:
            - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
            - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
            - KC_DB=postgres
            - KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/${DB_DATABASE:-keycloak}
            - KC_DB_USERNAME=${DB_USERNAME:-postgres}
            - KC_DB_PASSWORD=${DB_PASSWORD:-Pa55w.rd}
            - KC_HOSTNAME_STRICT=false
            - KC_HTTP_ENABLED=true
        command: start-dev
        depends_on:
        - keycloak-postgres

    keycloak-postgres:
        image: postgres:15-alpine
        container_name: keycloak-postgres
        restart: no
        networks:
        - flowise-net
        ports:
        - "5434:5432"
        volumes:
        - ./volumes/keycloak-postgres:/var/lib/postgresql/data
        environment:
        - POSTGRES_DB=${DB_DATABASE:-keycloak}
        - POSTGRES_USER=${DB_USERNAME:-postgres}
        - POSTGRES_PASSWORD=${DB_PASSWORD:-Pa55w.rd}
        command: >
            postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'
                    -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
                    -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
                    -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
                    -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
        healthcheck:
            test: [ 'CMD', 'pg_isready' ]
            interval: 1s
            timeout: 3s
            retries: 60

networks:
    flowise-net:
        driver: bridge
